<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      width: 200px;
      height: 200px;
      background: gray;
      margin-bottom: 20px;
    }

    .red{
      background: red;
    }

    .circle{
      border-radius: 50%;
    }

    .border{
      border: 5px solid black;
    }

  </style>
</head>
<body>
  <div id="box" class="box"></div>
  <button id="add">Add red</button>
  <button id="remove">Remove red</button>
  <button id="toggle">Toggle Circle</button>
  <button id="replace">Replace red with border</button>
  <button id="contains">Contains red</button>

  <script>
    const box = document.getElementById("box")
    const add = document.getElementById("add")

    add.addEventListener("click",function(){
      box.classList.add("red")
    })

    const remove = document.getElementById("remove")
    remove.addEventListener("click",function(){
      box.classList.remove("red")
    })

    const toggle = document.getElementById("toggle")
    toggle.addEventListener("click",function(){
      box.classList.toggle("circle")
    })

    const replace = document.getElementById("replace")
    replace.addEventListener("click",function(){
      box.classList.replace("red","border")
    })
    // document.getElementById("replace").onclick = function(){
    //   box.classList.replace("red","border")
    // }

    const contains = document.getElementById("contains")
    contains.addEventListener("click",function(){
      console.log(box.classList.contains("red"))
    })

  </script>
</body>
</html>
